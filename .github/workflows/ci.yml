name: CI

on:
  push:
    branches:
      - main
    # paths-ignore belongs on `push` only. The branch ruleset requires the
    # `verify` check on every PR, so a docs-only PR under a `pull_request`
    # paths-ignore would wait forever on a check that never runs.
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Runs the same chain contributors run locally. `verify` is
  # format:check -> lint -> build -> test -> typecheck, in that order:
  # build must precede typecheck because functions/ resolves
  # @bookbingo/lib-types through node_modules to lib/types/dist, which
  # does not exist on a fresh checkout.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Both versions come from the repo, not from this file: pnpm reads
      # `packageManager` in package.json, Node reads .nvmrc. Keep it that way —
      # a hardcoded version here silently diverges from what contributors run.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify

  # The only coverage the repository layer gets in CI: 7 *.db.test.ts files
  # that otherwise run by hand, including the `on delete restrict` invariant.
  # The service container is always empty, so this is also the only place
  # db/migrations/*.sql is proven to apply to a fresh database.
  test_db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bookbingo_test
          POSTGRES_PASSWORD: postgres
        # Mirrors docker-compose.yaml except the port: 5433 exists locally
        # only to dodge a host Postgres, and the runner has none.
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bookbingo_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:migrate
      - run: pnpm --filter @bookbingo/functions run test:db:ci

  # Staging tracks main. Lives in this workflow rather than its own so it
  # can depend on `verify` — `needs` cannot cross workflow boundaries, and
  # as two sibling workflows on the same trigger a failing build did not
  # stop the deploy.
  deploy_staging:
    needs: verify
    # Off until the deploy is actually configured. The first real run of this
    # job failed on `Input required and not supplied: firebaseServiceAccount`
    # — the repository has no secrets or variables set at all, so none of the
    # eight values below have ever existed. Rather than leave main permanently
    # red, the job is opt-in: create the service account and the seven
    # VITE_*_STAGING values, then
    #     gh variable set ENABLE_STAGING_DEPLOY --body true
    # and this starts running with no workflow edit.
    if: >-
      github.event_name != 'pull_request' &&
      vars.ENABLE_STAGING_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Both versions come from the repo, not from this file: pnpm reads
      # `packageManager` in package.json, Node reads .nvmrc. Keep it that way —
      # a hardcoded version here silently diverges from what contributors run.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bookbingo/web build:staging
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY_STAGING }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN_STAGING }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID_STAGING }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET_STAGING }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID_STAGING }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID_STAGING }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID_STAGING }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: deploy
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOOKBINGO_STAGING }}
          channelId: live
          projectId: bookbingo-staging
          entryPoint: .
      - name: Display deployment URL
        run: |
          echo "## Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Live Site URL:" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **[https://bookbingo-staging.web.app](https://bookbingo-staging.web.app)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your application has been deployed to Firebase Hosting." >> $GITHUB_STEP_SUMMARY
